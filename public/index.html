<!doctype html>
<html lang="sl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moj FERI urnik</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <main class="shell">
    <aside class="sidebar">
      <div class="side-title"><div><h2>Moji predmeti</h2><span id="courseCount" class="muted"></span></div><button id="addToggle" class="icon">＋</button></div>
      <section id="addPanel" class="add-panel hidden">
        <label>Dodaj predmet z Wise ID-jem</label>
        <div class="id-add"><input id="directId" inputmode="numeric" placeholder="npr. 12904"><button id="addId">Dodaj</button></div>
        <small>ID pred dodajanjem preverimo v dejanskem katalogu.</small>
      </section>
      <div id="coursePanels"></div>
      <button id="reset" class="link-button">Ponastavi privzeto izbiro</button>
    </aside>
    <section class="content">
      <div class="toolbar">
        <button id="sidebarToggle" class="sidebar-toggle" aria-label="Odpri predmete">☰</button>
        <div class="week-nav"><button id="prev" aria-label="Prejšnji teden">‹</button><button id="today">Danes</button><button id="next" aria-label="Naslednji teden">›</button><label class="date-control"><span>▣</span><input id="date" type="date"></label></div>
        <div class="toolbar-end"><div class="view-toggle"><button data-view="week" class="active">Teden</button><button data-view="list">Seznam</button></div><button id="refresh" class="refresh-icon" title="Osveži podatke" aria-label="Osveži podatke">↻</button></div>
      </div>
      <div class="statusline"><strong id="weekLabel"></strong><span id="status" class="muted"></span><span id="published" class="muted"></span></div>
      <div id="notice"></div><div id="schedule"></div>
    </section>
  </main>
  <dialog id="eventDialog"><button class="dialog-close" aria-label="Zapri">×</button><div id="eventDetails"></div></dialog>
  <script type="module" src="/app.js"></script>
</body></html>
